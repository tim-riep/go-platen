# Package of the Linux desktop client, built by build.sh with nfpm.
name: platen-desktop
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: platen <https://github.com/tim-riep/go-platen>
description: |
  Print client for platen print servers.
  Installs the printers of a platen server as CUPS printers and sends what
  is printed on them as PDF to the server through the NetBird mesh. A
  system service does the work; a tray icon and a settings page in the
  browser show its state.
homepage: https://github.com/tim-riep/go-platen
license: Apache-2.0
depends:
  - cups
  - cups-filters
  - adduser
recommends:
  - xdg-utils
  - libnotify-bin
contents:
  - src: build/stage/platen-desktop
    dst: /usr/bin/platen-desktop
    file_info:
      mode: 0755
  - src: ../macos/Resources/platen.ppd
    dst: /usr/share/platen-desktop/platen.ppd
    file_info:
      mode: 0644
  - src: platen-desktop.service
    dst: /lib/systemd/system/platen-desktop.service
    file_info:
      mode: 0644
  - src: platen.desktop
    dst: /usr/share/applications/platen.desktop
    file_info:
      mode: 0644
  - src: platen-tray.desktop
    dst: /etc/xdg/autostart/platen-tray.desktop
    type: config
    file_info:
      mode: 0644
  - src: ../../cmd/platen-desktop/platen.png
    dst: /usr/share/icons/hicolor/256x256/apps/platen.png
    file_info:
      mode: 0644
  - src: copyright
    dst: /usr/share/doc/platen-desktop/copyright
    file_info:
      mode: 0644
  - src: ../../THIRD_PARTY_LICENSES
    dst: /usr/share/doc/platen-desktop/THIRD_PARTY_LICENSES
    file_info:
      mode: 0644
scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh
