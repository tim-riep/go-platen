# Checks and unsigned builds for every push to main and every pull request.
# CI never signs anything and uses no secrets; version tags (v*) run the
# release workflow (release.yml) instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install go-licenses
        run: go install github.com/google/go-licenses/v2@latest
      # github.com/jackpal/go-nat-pmp and github.com/jmespath/go-jmespath
      # were verified as Apache-2.0 by hand; go-licenses cannot classify
      # their license files. Their texts are added to THIRD_PARTY_LICENSES
      # from third_party/manual. See docs/licensing.md.
      - name: license check
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,CC0-1.0 \
            --ignore github.com/jackpal/go-nat-pmp \
            --ignore github.com/jmespath/go-jmespath
      - name: license check (Windows client)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go-licenses check ./cmd/platen-desktop \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,CC0-1.0 \
            --ignore github.com/jackpal/go-nat-pmp \
            --ignore github.com/jmespath/go-jmespath
      - name: MPL-2.0 modules approved
        run: ./scripts/check-mpl.sh
      - name: no AGPL parts of NetBird
        run: |
          if go list -deps ./... | grep -E 'netbirdio/netbird/(management|signal|relay|combined)(/|$)'; then
            echo "AGPL licensed NetBird packages must not be imported" >&2
            exit 1
          fi
      - name: THIRD_PARTY_LICENSES up to date
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code THIRD_PARTY_LICENSES

  build:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
            -o dist/platen-linux-${{ matrix.goarch }} ./cmd/platen
      - uses: actions/upload-artifact@v4
        with:
          name: platen-linux-${{ matrix.goarch }}
          path: dist/platen-linux-${{ matrix.goarch }}

  # The Windows client on Windows: the end-to-end test installs real
  # printers with the "Microsoft Print To PDF" driver, prints on one and
  # checks the job at an in-process server.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./internal/desktop ./cmd/platen-desktop
      - name: test
        env:
          PLATEN_WINDOWS_E2E: "1"
        run: go test -v -count=1 ./internal/desktop

  # Builds the unsigned Windows installer.
  windows-installer:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: build
        run: desktop/windows/build.sh --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: platen-windows-unsigned
          path: desktop/windows/build/*-setup.exe

  # Builds the macOS app and its unsigned installer.
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: checks
        run: swift run PlatenChecks
      - name: build
        run: ./build.sh --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: platen-macos-unsigned
          path: desktop/macos/build/*.pkg

  # Builds the container image for amd64 and arm64 without publishing it.
  image:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
