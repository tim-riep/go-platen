name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install go-licenses
        run: go install github.com/google/go-licenses/v2@latest
      - name: license check
        run: go-licenses check ./... --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC
      - name: THIRD_PARTY_LICENSES up to date
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code THIRD_PARTY_LICENSES

  build:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
            -o dist/platen-linux-${{ matrix.goarch }} ./cmd/platen
      - uses: actions/upload-artifact@v4
        with:
          name: platen-linux-${{ matrix.goarch }}
          path: dist/platen-linux-${{ matrix.goarch }}
