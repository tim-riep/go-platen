name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install go-licenses
        run: go install github.com/google/go-licenses/v2@latest
      # github.com/jackpal/go-nat-pmp and github.com/jmespath/go-jmespath
      # were verified as Apache-2.0 by hand; go-licenses cannot classify
      # their license files. Their texts are added to THIRD_PARTY_LICENSES
      # from third_party/manual. See docs/licensing.md.
      - name: license check
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0,CC0-1.0 \
            --ignore github.com/jackpal/go-nat-pmp \
            --ignore github.com/jmespath/go-jmespath
      - name: MPL-2.0 modules approved
        run: ./scripts/check-mpl.sh
      - name: no AGPL parts of NetBird
        run: |
          if go list -deps ./... | grep -E 'netbirdio/netbird/(management|signal|relay|combined)(/|$)'; then
            echo "AGPL licensed NetBird packages must not be imported" >&2
            exit 1
          fi
      - name: THIRD_PARTY_LICENSES up to date
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code THIRD_PARTY_LICENSES

  build:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
            -o dist/platen-linux-${{ matrix.goarch }} ./cmd/platen
      - uses: actions/upload-artifact@v4
        with:
          name: platen-linux-${{ matrix.goarch }}
          path: dist/platen-linux-${{ matrix.goarch }}

  # Builds the container image for amd64 and arm64 on every run. It is pushed
  # to the GitHub Container Registry only for version tags (v*).
  image:
    runs-on: ubuntu-latest
    needs: [test, licenses]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
